; PlatformIO Unity test environments for IpAddress tests
; (Renamed from platformio.ini to avoid affecting default builds)

[platformio]
default_envs = unity_esp32

[env:unity_esp32]
platform = espressif32
board = esp32dev
framework = arduino
test_build_project_src = true
test_filter = test_ip_address

[env:unity_esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
test_build_project_src = true
test_filter = test_ip_address
