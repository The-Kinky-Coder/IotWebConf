[common]
lib_deps =
  IotWebConf
  me-no-dev/ESP Async WebServer

[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ${common.lib_deps}

[env:esp32s3usbotg]
platform = espressif32
board = esp32s3usbotg
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ${common.lib_deps}

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ${common.lib_deps}

[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ${common.lib_deps}
